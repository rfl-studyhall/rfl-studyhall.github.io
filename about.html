<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Hall · Videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --green: #7CFA6B; --black: #0A0A0A; --grey: #9A9A9A; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px 64px;
    background: var(--black);
    color: var(--grey);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  h1 {
    margin: 0 0 40px;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    line-height: 1.5;
    color: var(--green);
  }
  .videos {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 40px;
  }
  figure { margin: 0; width: 360px; max-width: 100%; }
  .frame {
    aspect-ratio: 4 / 5;
    border: 1.5px solid var(--green);
    background: #000;
    overflow: hidden;
  }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  figcaption {
    margin-top: 10px;
    display: flex; justify-content: space-between; gap: 12px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  figcaption b { color: var(--green); }
  a { color: var(--green); }
</style>
</head>
<body>
  <h1>STUDY HALL<br>IS LIVE</h1>

  <div class="videos">
    <figure>
      <div class="frame">
        <iframe src="promo/index.html" title="Study Hall promo, Instagram cut" loading="lazy"></iframe>
      </div>
      <figcaption><b>Instagram · 4:5 · 9s loop</b><a href="promo/index.html" target="_blank" rel="noopener">open</a></figcaption>
    </figure>

    <figure>
      <div class="frame">
        <iframe src="promo/index.html?variant=linkedin" title="Study Hall promo, LinkedIn cut" loading="lazy"></iframe>
      </div>
      <figcaption><b>LinkedIn · 4:5 · 9s loop</b><a href="promo/index.html?variant=linkedin" target="_blank" rel="noopener">open</a></figcaption>
    </figure>
  </div>
</body>
</html>
